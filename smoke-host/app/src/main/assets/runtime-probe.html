<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>内核运行检查</title>
<h1>内核运行检查</h1>
<pre id="result">运行中</pre>
<canvas id="canvas" width="128" height="128"></canvas>
<div id="fixture"></div>
<script>
(async () => {
  const report = { checks: {}, timingsMs: {}, speechSynthesis: "speechSynthesis" in window };
  const check = (name, value) => { report.checks[name] = Boolean(value); };
  try {
    check("dom", document.querySelector("h1").textContent === "内核运行检查");
    const canvas = document.querySelector("canvas");
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#ff0000";
    ctx.fillRect(0, 0, 128, 128);
    check("canvas", ctx.getImageData(1, 1, 1, 1).data[0] === 255);
    const gl = document.createElement("canvas").getContext("webgl");
    check("webgl", gl && gl.getParameter(gl.VERSION));
    check("wasm", await WebAssembly.validate(new Uint8Array([0,97,115,109,1,0,0,0])));
    check("indexedDB", typeof indexedDB.open === "function");
    check("webrtc", typeof RTCPeerConnection === "function");
    if (new URLSearchParams(location.search).get("trimmed") === "true") {
      check("speechRemoved", !("speechSynthesis" in window) && !("SpeechRecognition" in window) && !("webkitSpeechRecognition" in window));
    }
    // Small repeatable native-facing workloads; not a full browser benchmark.
    const fixture = document.querySelector("#fixture");
    fixture.innerHTML = "<span>中文内容 abc123</span>".repeat(200);
    const layout = [], paint = [];
    for (let round = 0; round < 7; round++) {
      let start = performance.now();
      for (let n = 0; n < 80; n++) {
        fixture.style.width = (180 + n % 13) + "px";
        fixture.getBoundingClientRect();
      }
      layout.push(performance.now() - start);
      start = performance.now();
      for (let n = 0; n < 2000; n++) ctx.fillRect(n % 128, (n * 7) % 128, 3, 3);
      ctx.getImageData(0, 0, 128, 128);
      paint.push(performance.now() - start);
    }
    const median = values => values.slice(1).sort((a,b) => a-b)[Math.floor((values.length - 1) / 2)];
    report.timingsMs.layout = median(layout);
    report.timingsMs.canvas = median(paint);
    report.passed = Object.values(report.checks).every(Boolean);
  } catch (error) { report.error = String(error); report.passed = false; }
  window.runtimeProbeResult = report;
  document.querySelector("#result").textContent = JSON.stringify(report, null, 2);
  document.title = "TRIM_PROBE:" + JSON.stringify(report);
})();
</script>
</html>
